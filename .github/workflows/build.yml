name: Build
on:
  push:
    branches: [main, chatgpt/rewrite-v0.2.0-unified, jinchan-clean-base]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # ubuntu-24.04 already provides Android SDK Platform android-37.0,
      # Build-tools 37.0.0 and ANDROID_HOME/ANDROID_SDK_ROOT.
      # Do not replace that SDK with a fresh command-line-tools-only root.
      - name: Verify Android SDK 37
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms/android-37"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install Python verification dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check --quiet
          Pillow opencv-python-headless
      - name: Python syntax and resource integrity
        run: |
          python3 -m compileall -q tools
          python3 tools/quality/check_resources.py
          python3 tools/quality/check_project.py
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon --continue clean testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/**
